name: release

on:
  push:
    tags:
      - "v*"

jobs:
  # PluginVersion feeds the Claude Code plugin manifest, which users install
  # independently of the binary. A tag that disagrees with it would publish a
  # plugin claiming a version the binary never had.
  verify-version:
    name: Verify the tag matches PluginVersion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -oE 'PluginVersion = "[^"]+"' main.go | cut -d'"' -f2)
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with PluginVersion ($declared) in main.go"
            exit 1
          fi

  release:
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v4
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
